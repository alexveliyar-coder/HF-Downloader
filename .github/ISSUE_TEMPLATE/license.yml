> **If you just want to use HF Downloader for personal, non-commercial purposes** — you don't need a commercial license. The AGPLv3 already gives you that right for free. This template is for inquiries that go beyond what AGPLv3 permits.
>
> See [COMMERCIAL_LICENSE.md](../blob/main/COMMERCIAL_LICENSE.md) for the full picture.

## What are you looking for?

- [ ] A **commercial license** to use HF Downloader inside a proprietary product
- [ ] A **commercial license** to distribute a closed-source fork or build
- [ ] A **commercial license** to run HF Downloader as a hosted / SaaS service
- [ ] Permission to **acquire the project** (full transfer of copyright / trademarks)
- [ ] Other / not sure (please describe)

