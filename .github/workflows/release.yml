name: release

# Срабатывает ТОЛЬКО при пуше тега вида v1.2.3.
# Как выпустить новую версию:
#   1. Поменяй VERSION в updater.py и CHANGELOG.md
#   2. git tag v1.2.3
#   3. git push origin v1.2.3
# После этого автоматически соберутся три артефакта, прикрепятся к релизу,
# и updater.py начнёт уведомлять существующих юзеров.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # для ручного запуска из GitHub UI (Actions → release → Run)

permissions:
  contents: write  # чтобы создать релиз и прикрепить артефакты

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: HF-Downloader-windows.zip
            folder: HF-Downloader
          - os: macos-latest
            artifact: HF-Downloader-macos.zip
            folder: HF-Downloader
          - os: ubuntu-latest
            artifact: HF-Downloader-linux.zip
            folder: HF-Downloader

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sanity-check (import)
        run: |
          python -c "import main; print('main OK')"
          python -c "import sys; sys.path.insert(0, 'src'); import hf_core_server; print('hf_core_server OK')"
          python -c "import sys; sys.path.insert(0, 'src'); import updater; print('updater version:', updater.VERSION)"

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean hfdownloader.spec

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          # На всех платформах PyInstaller создаёт папку HF-Downloader
          if [ -d "HF-Downloader" ]; then
            7z a ../${{ matrix.artifact }} HF-Downloader/ 2>/dev/null || \
              zip -r ../${{ matrix.artifact }} HF-Downloader/
          else
            echo "ERROR: dist/HF-Downloader not found"
            ls -la
            exit 1
          fi
          cd ..
          ls -la ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what we got
        run: |
          ls -la artifacts/
          for d in artifacts/*/; do echo "--- $d"; ls -la "$d"; done

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            artifacts/**/*.zip
          fail_on_unmatched_files: false
          body: |
            ## Скачать
            
            - 🪟 **Windows**: `HF-Downloader-windows.zip` — распакуй и кликни `HF-Downloader\HF-Downloader.exe`
            - 🍎 **macOS**: `HF-Downloader-macos.zip` — распакуй и открой `HF-Downloader.app` (если macOS ругается — правой кнопкой → «Открыть»)
            - 🐧 **Linux**: `HF-Downloader-linux.zip` — распакуй и запусти `./HF-Downloader/HF-Downloader`
            
            ## Проверить обновление
            
            При следующем запуске программа сама напишет в консоль, что есть новая версия.
            Полные изменения — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
