version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # Major/minor updates are kept separate from patches so PRs stay small.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Don't auto-upgrade PyInstaller — it needs a test build.
    ignore:
      - dependency-name: "pyinstaller"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
