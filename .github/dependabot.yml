version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # Мажорные/минорные апдейты — отдельно от патчей, чтобы PR был меньше.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Не апгрейдим PyInstaller автоматически — он требует тестовой сборки.
    ignore:
      - dependency-name: "pyinstaller"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
